services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cv_generator
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cv_generator"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cv_generator
      # Fill an empty database with demo staff, projects and assignments on start.
      SEED_DEMO_DATA: "true"
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
      # Templates edited in the UI. Docker fills the volume from the image only when it is first created;
      # after that, to pick up changes made to server/templates in the repo (discarding UI edits), run
      # `docker compose rm -sf server && docker volume rm giscon-task_templates && docker compose up -d server`.
      - templates:/app/templates
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  db-data:
  uploads:
  templates:
